[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-memory"
version = "0.1.0"
description = "Hive Memory — an external, multi-agent context-curation layer for long-horizon LLM conversations, plus the HiveBench evaluation suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "huggingface_hub>=0.23",
    "zstandard>=0.22",
    "tiktoken>=0.7.0",
    "sentence-transformers>=2.2.0",
    "transformers>=4.36.0",
    "torch>=2.1.0",
]

[project.optional-dependencies]
# The system, harness, and bench install cleanly in layers:
#   pip install hive-memory            # the system (drones + cortex + backends)
#   pip install "hive-memory[harness]" # + the HiveBench Studio sidecar
#   pip install "hive-memory[bench]"   # + the evaluation suite (pytest + ST trainer)
harness = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.12,<3",
    "python-multipart>=0.0.9",
]
bench = [
    "pytest>=8.0",
    "accelerate>=1.1.0",
    "datasets>=3.0",
]

[project.scripts]
hivebench = "experiments.generate_data:main"
hivebench-protocol = "experiments.run_p1_p10:main"
hivebench-probe = "experiments.model_probe:main"
hivebench-diagnostic = "experiments.retrieval_diagnostic:main"
hivebench-gate-ab = "experiments.confirmation_gate_ab:main"
hivebench-compare = "experiments.run_compare:main"
hivebench-ab = "experiments.paired_ab:main"
hivebench-harness = "harness.__main__:main"

# Three package roots, flat import names preserved:
#   hive/      -> cortex, sieve, membrane, retention, focal, backend, queen, logs
#                (the system; hive.__init__ is the public facade — hive/ never
#                 imports from hivebench/ or harness/)
#   hivebench/ -> tests, testing, experiments
#   harness/   -> the HiveBench Studio sidecar (python -m harness)
[tool.setuptools.packages.find]
where = ["hive", "hivebench", "harness"]